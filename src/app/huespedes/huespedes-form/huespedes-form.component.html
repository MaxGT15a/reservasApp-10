<mat-toolbar color="primary">
  <span>{{ esEdicion ? 'Editar Huésped' : 'Registrar Nuevo Huésped' }}</span>
</mat-toolbar>

<div class="container" style="padding: 20px; max-width: 600px;">
  <form [formGroup]="huespedForm" (ngSubmit)="guardar()" style="display: flex; flex-direction: column; gap: 15px;">
    
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="apellido">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de Documento</mat-label>
      <input matInput formControlName="tipoDocumento" placeholder="INE, Pasaporte...">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Número de Documento</mat-label>
      <input matInput formControlName="numeroDocumento">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Nacionalidad</mat-label>
      <input matInput formControlName="nacionalidad">
    </mat-form-field>

    <div style="display: flex; gap: 10px;">
      <button mat-raised-button color="primary" type="submit" [disabled]="huespedForm.invalid">Guardar</button>
      <button mat-button type="button" routerLink="/huespedes">Cancelar</button>
    </div>

  </form>
</div>
