<mat-toolbar color="primary">
  <span>Listado de Huéspedes</span>
  <span class="spacer" style="flex: 1 1 auto;"></span>
  <button mat-raised-button color="accent" routerLink="nuevo">
    <mat-icon>add</mat-icon> Nuevo Huésped
  </button>
</mat-toolbar>

<div class="container" style="padding: 20px;">
  <div class="loading" *ngIf="cargando" style="display: flex; justify-content: center; margin: 20px 0;">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <table mat-table [dataSource]="huespedes" *ngIf="!cargando" class="mat-elevation-z2" style="width: 100%;">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let h"> {{ h.id }} </td>
    </ng-container>

    <ng-container matColumnDef="nombreCompleto">
      <th mat-header-cell *matHeaderCellDef> Nombre Completo </th>
      <td mat-cell *matCellDef="let h"> {{ h.nombre }} {{ h.apellido }} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let h"> {{ h.email }} </td>
    </ng-container>

    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef> Teléfono </th>
      <td mat-cell *matCellDef="let h"> {{ h.telefono }} </td>
    </ng-container>

    <ng-container matColumnDef="documento">
      <th mat-header-cell *matHeaderCellDef> Documento </th>
      <td mat-cell *matCellDef="let h"> {{ h.tipoDocumento }}: {{ h.numeroDocumento }} </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let h">
        <button mat-icon-button color="primary" matTooltip="Editar" [routerLink]="['editar', h.id]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" matTooltip="Eliminar" *ngIf="isAdmin" (click)="h.id
         && eliminar(h.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'nombreCompleto', 'email', 'telefono', 'documento', 'acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id', 'nombreCompleto', 'email', 'telefono', 'documento', 'acciones'];"></tr>
  </table>

  <p *ngIf="!cargando && huespedes.length === 0" class="sin-datos" style="text-align: center; margin-top: 20px;">
    No hay huéspedes registrados.
  </p>
</div>
