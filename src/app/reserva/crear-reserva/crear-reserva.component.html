<mat-toolbar color="primary">
  <span>Crear Nueva Reserva</span>
</mat-toolbar>

<div class="container" style="padding: 20px; max-width: 600px;">
  
  <!-- Alertas de error (incluyendo código 409 de conflicto) o éxito -->
  <div *ngIf="mensajeError" style="background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 4px; margin-bottom: 15px;">
    {{ mensajeError }}
  </div>
  <div *ngIf="mensajeExito" style="background-color: #d4edda; color: #155724; padding: 12px; border-radius: 4px; margin-bottom: 15px;">
    {{ mensajeExito }}
  </div>

  <form [formGroup]="reservaForm" (ngSubmit)="onSubmit()" style="display: flex; flex-direction: column; gap: 15px;">
    
    <mat-form-field appearance="outline">
      <mat-label>ID del Huésped</mat-label>
      <input matInput type="number" formControlName="idHuesped" placeholder="Ej. 1">
      <mat-hint>El huésped debe existir y estar activo.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Num de la Habitación</mat-label>
      <input matInput type="number" formControlName="idHabitacion" placeholder="Ej. 101">
      <mat-hint>La habitación debe estar disponible y activa.</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Entrada</mat-label>
      <input matInput type="date" formControlName="fechaEntrada">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Salida</mat-label>
      <input matInput type="date" formControlName="fechaSalida">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Número de Personas</mat-label>
      <input matInput type="number" formControlName="numPersonas" min="1">
      <mat-hint>Debe ser menor o igual a la capacidad de la habitación.</mat-hint>
    </mat-form-field>

    <div style="display: flex; gap: 10px;">
      <button mat-raised-button color="primary" type="submit" [disabled]="reservaForm.invalid">Procesar Reserva</button>
      <button mat-button type="button" routerLink="/reservas">Volver</button>
    </div>

  </form>
</div>
