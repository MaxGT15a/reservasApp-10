<mat-toolbar color="primary">
  <span>Gestión de Reservas</span>
  <span class="spacer" style="flex: 1 1 auto;"></span>
  <button mat-raised-button color="accent" routerLink="crear">
    <mat-icon>add</mat-icon> Nueva Reserva
  </button>
</mat-toolbar>

<div class="container" style="padding: 20px;">
  <div class="loading" *ngIf="cargando" style="display: flex; justify-content: center; margin: 20px 0;">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <table mat-table [dataSource]="reservas" *ngIf="!cargando" class="mat-elevation-z2" style="width: 100%;">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let r"> {{ r.id }} </td>
    </ng-container>

    <ng-container matColumnDef="huesped">
      <th mat-header-cell *matHeaderCellDef> Huésped </th>
      <td mat-cell *matCellDef="let r"> {{ r.huesped?.nombreCompleto }} </td>
    </ng-container>

    <ng-container matColumnDef="habitacion">
      <th mat-header-cell *matHeaderCellDef> Habitación </th>
      <td mat-cell *matCellDef="let r"> {{ r.habitacion?.numero }} </td>
    </ng-container>

    <ng-container matColumnDef="fechas">
      <th mat-header-cell *matHeaderCellDef> Fechas (Entrada / Salida) </th>
      <td mat-cell *matCellDef="let r"> {{ r.fechaEntrada }} al {{ r.fechaSalida }} </td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef> Total </th>
      <td mat-cell *matCellDef="let r"> {{ r.precioTotal | currency }} </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let r">
        <span style="font-weight: bold; color: #3f51b5;">{{ r.estadoReserva }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button color="warn" matTooltip="Cancelar Reserva" (click)="r.id && cancelar(r.id)">
          <mat-icon>cancel</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'huesped', 'habitacion', 'fechas', 'total', 'estado', 'acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id', 'huesped', 'habitacion', 'fechas', 'total', 'estado', 'acciones'];"></tr>
  </table>

  <p *ngIf="!cargando && reservas.length === 0" class="sin-datos" style="text-align: center; margin-top: 20px;">
    No hay reservas registradas.
  </p>
</div>
